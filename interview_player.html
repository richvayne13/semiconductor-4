<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🚗 차 안에서 듣는 모의면접 (내 목소리 전용 플레이어)</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131c2e;
      --card-active: #1d2a45;
      --accent: #38bdf8;
      --accent-rgb: 56, 189, 248;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #23334d;
      --q-color: #a5b4fc;
      --a-color: #34d399;
      --dock-bg: rgba(15, 23, 42, 0.95);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 240px;
      overflow-x: hidden;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 13, 22, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-car {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }
    .stats-pill {
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(255,255,255,0.06);
      padding: 4px 10px;
      border-radius: 20px;
    }
    
    /* Category Filter Chips */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .chip {
      background: #1e293b;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip.active {
      background: var(--accent);
      color: #04101e;
      border-color: var(--accent);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
    }

    /* Cards Stream */
    .card-list {
      max-width: 860px;
      margin: 16px auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
    }
    .item-card.active {
      border-color: var(--accent);
      background: var(--card-active);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.25);
      transform: scale(1.015);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .card-cat {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .cat-exp { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid #f59e0b; }
    .cat-tech { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid #38bdf8; }
    .cat-pers { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid #a855f7; }
    .cat-note { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid #10b981; }
    
    .card-q {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .card-a {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.65;
      background: rgba(0,0,0,0.25);
      padding: 12px 14px;
      border-radius: 8px;
      border-left: 3px solid var(--a-color);
      display: none;
    }
    .item-card.show-ans .card-a { display: block; }
    .item-card.speaking-q .card-q { color: var(--accent); }
    .item-card.speaking-a .card-a { border-left-color: var(--accent); background: rgba(56, 189, 248, 0.1); }

    /* Bottom Car-Mode Player Dock */
    .car-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--dock-bg);
      backdrop-filter: blur(18px);
      border-top: 1px solid var(--border);
      padding: 14px 20px 24px;
      z-index: 100;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.5);
    }
    .dock-container {
      max-width: 860px;
      margin: 0 auto;
    }
    .status-banner {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .timer-badge {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid #ef4444;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      display: none;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.1s linear;
    }
    
    /* Controls */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .btn-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-circle:active { transform: scale(0.92); }
    .btn-play-big {
      width: 68px;
      height: 68px;
      background: var(--accent);
      color: #090d16;
      border: none;
      font-size: 26px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }
    
    /* Config bar */
    .config-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      font-size: 12.5px;
      color: var(--text-muted);
    }
    .delay-slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type=range] {
      accent-color: var(--accent);
      width: 110px;
      cursor: pointer;
    }
    .toggle-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 600;
    }
    .toggle-btn.active {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-top">
      <div class="header-title">
        <span>🚗 차 안 모의면접</span>
        <span class="badge-car">내 목소리 전용</span>
      </div>
      <div class="stats-pill" id="statsPill">0 / 0 문항</div>
    </div>
    <div class="filter-bar" id="filterBar">
      <div class="chip active" data-cat="all">전체보기</div>
      <div class="chip active" data-cat="experience">내경험기반</div>
      <div class="chip active" data-cat="tech">AISK직무</div>
      <div class="chip active" data-cat="personality">AISK인성</div>
    </div>
  </header>

  <!-- Items Stream -->
  <main class="card-list" id="cardList"></main>

  <!-- Bottom Car Player Dock -->
  <footer class="car-dock">
    <div class="dock-container">
      <div class="status-banner">
        <span id="dockStatus">준비 완료 — 재생 버튼을 누르세요</span>
        <span class="timer-badge" id="timerBadge">생각 시간: 10s</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="controls-row">
        <button class="btn-circle" id="btnPrev" title="이전 질문">⏮️</button>
        <button class="btn-circle" id="btnShuffle" title="랜덤 재생 토글">🔀</button>
        <button class="btn-circle btn-play-big" id="btnPlayMain" title="재생/일시정지">▶</button>
        <button class="btn-circle" id="btnShowAnsToggle" title="답변 텍스트 항상 열기">👁️</button>
        <button class="btn-circle" id="btnNext" title="다음 질문">⏭️</button>
      </div>
      <div class="config-row">
        <div class="delay-slider-wrap">
          <span>생각 시간: <strong id="delayVal" style="color:var(--accent);">10</strong>초</span>
          <input type="range" id="delaySlider" min="0" max="60" step="5" value="10">
        </div>
        <button class="toggle-btn active" id="btnAutoScroll">📜 자동스크롤 ON</button>
      </div>
    </div>
  </footer>

  <script>
const INTERVIEW_MATERIALS = [
  {
    "id": "p_01",
    "category": "AISK인성",
    "category_key": "personality",
    "question": "직무에 지원한 이유와 본인이 가장 적합하다고 생각하는 이유",
    "answer": "저는 마이크로를 넘어 나노단위의 기술적 스케일업을 하고 싶어서 지원했습니다. 현업에서 여러 프로젝트를 통해 마이크로미터수준에서 수율을 개선하면서 엔지니어의 역량을 쌓았고, 이를 나노단위로의 엔지니어링으로 스케일업해보고 싶습니다. 생산기술엔지니어는 불량 발생 시 피시본차트로 원인을 분석하고 적절한 엔지니어링 기법을 적용해 개선안을 수립해야 합니다. 저는 미세라인 불량감지로직 개발 프로젝트에서 Dynamic threshold와 지수이동평균ema을 계측로직에 적용해 해당항목 불량을 50% 개선하고 CEO포상을받았습니다. 이처럼 저는 양산기술엔지니어로서 관리적인 측면에서 미세한 공정편차를 센싱하기 위해서 지수이동평균을 도입하였고 어떤 기준으로 센싱할지를 고민해봤기 떄문에 직무에 적합하다고 생각합니다.",
    "audio_q": "voices/questions/p_01.mp3",
    "audio_a": "voices/lectures/p_01.mp3"
  },
  {
    "id": "p_02",
    "category": "AISK인성",
    "category_key": "personality",
    "question": "회사 지원 동기",
    "answer": "SK하이닉스에 지원한 이유는 세계 최고 수준의 기술 리더십과 한계를 두려워하지 않는 기술 1등 DNA에 깊이 공감했기 때문입니다. AI 시대의 도래 속에서 메모리는 단순 저장 장치를 넘어 시스템 전체의 성능을 결정짓는 핵심 축으로 자리잡았습니다. 첫째, SK하이닉스는 독보적인 MR-MUF 패키징 기술과 초고속 TSV 적층 공정을 바탕으로 방열과 휨 한계를 극복하며 글로벌 HBM 시장을 선도하고 있습니다. 남들이 가지 않은 길을 기술력으로 돌파해 메모리의 새로운 패러다임을 여는 모습에 엔지니어로서 강한 자부심과 매력을 느꼈습니다. 둘째, 실패를 두려워하지 않고 데이터와 집념으로 수율 한계를 넘어서는 조직 문화 속에서 저의 분석 역량을 가장 크게 꽃피울 수 있다고 확신했습니다. 초미세 1b, 1c 나노 DRAM과 300단 이상 3D NAND 및 차세대 HBM 양산 최전선에서 미세 산포를 제어하고 글로벌 팹의 원가와 수율 경쟁력을 극대화하는 주역이 되겠습니다.",
    "audio_q": "voices/questions/p_02.mp3",
    "audio_a": "voices/lectures/p_02.mp3"
  },
  {
    "id": "t_com01",
    "category": "AISK직무",
    "category_key": "tech",
    "question": "반도체 핵심 절연막 SiO2(옥사이드)의 정의, 4대 역할 및 주요 적용 레이어",
    "answer": "SiO2는 비정질 결정을 가지는 우수한 절연 물질로 9.1eV의 높은 밴드갭으로 저항 특성이 좋습니다. 일단 breakdown voltage(절연파괴전압)가 10MV/cm 이상 높아 높은 전계에서도 신뢰성이 보장되고요, 실리콘과 인터페이스 퀄리티(Interface Quality)가 우수합니다. SiO2의 핵심 역할은 총 여섯 가지인데요, 먼저 게이트 모듈과 아이솔레이션입니다. 게이트 모듈에서는 트랜지스터의 게이트 산화막(Gate Oxide) 그리고 게이트 스페이서에 사용되고요, 아이솔레이션에서는 전기적 절연 및 소자 간 격리 역할을 하는데, 배선이나 인접 트랜지스터에서 누설 전류를 차단하는 역할을 하고요, STI 트렌치 매립 산화막에 사용됩니다. 세 번째는 패시베이션인데요, 수분 침투를 방지합니다. 네 번째는 하드마스크로, 이온주입 공정, 디퓨전, 에칭에서 마스킹 역할을 합니다. 그리고 스페이서 리소그래피(Spacer Lithography)에서 실리콘을 보호하는 역할을 하기도 합니다. 마지막으로는 금속 배선에서 절연 역할을 하는 ILD, IMD에 사용됩니다.",
    "audio_q": "voices/questions/t_com01.mp3",
    "audio_a": "voices/lectures/t_com01.mp3"
  },
  {
    "id": "t_com02",
    "category": "AISK직무",
    "category_key": "tech",
    "question": "CVD(화학기상증착)의 메커니즘 원리·특징 및 주요 적용 레이어",
    "answer": "CVD는 반응가스들을 주입하여 웨이퍼 표면에서 화학적 반응을 통해 박막형성하는 기술 반응가스를 챔버내부로 주입하고 열,플라즈마 에너지를 가하여 확산에 의해 반응종들이 표면으로 이동하고 표면에서 반응을 통해 박막 형성되고 부산물이 배기됩니다. CVD가 적용되는 주요 레이어는 절연막과 전도막으로 나뉩니다. 첫째, '절연막 레이어'입니다. 트랜지스터 간 격리를 위해 깊고 좁은 트렌치를 메우는 STI 갭필 옥사이드, ILD/IMD 층간 절연막, 패턴 전사를 위한 SiN 질화막 하드마스크(LPCVD) 및 게이트 측벽 스페이서가 대표적입니다. 특히 3D NAND에서는 옥사이드와 나이트라이드를 수백 단 교대로 쌓아 올리는 몰드 형성에 핵심적으로 사용됩니다. 둘째, '전도막 레이어'입니다. 게이트 전극인 폴리실리콘(LPCVD)과, 하부 트랜지스터와 상부 금속 배선을 전기적으로 연결해 주는 수직 비아 홀을 빈틈없이 채우는 텅스텐 플러그 공정에 필수적으로 적용됩니다.",
    "audio_q": "voices/questions/t_com02.mp3",
    "audio_a": "voices/lectures/t_com02.mp3"
  },
  {
    "id": "t_com03",
    "category": "AISK직무",
    "category_key": "tech",
    "question": "PVD(물리적기상증착) 스퍼터링 메커니즘·특징 및 주요 적용 레이어",
    "answer": "PVD는 고진공 챔버 내에서 쉬스전압에 의해 가속된 아르곤 이온을 금속 타깃에 물리적으로 충돌시켜 튀어나온 금속 원자를 웨이퍼 표면에 물리적으로 증착하는 기술입니다. 화학 전구체를 쓰지 않으므로 불순물 잔류가 없어 초고순도 박막을 얻을 수 있지만, 입자가 직진하여 날아가므로 깊고 좁은 종횡비 패턴에서는 측벽과 바닥의 step coverage가 낮다는 물리적 한계를 갖습니다. PVD가 적용되는 주요 레이어는 다음과 같습니다. 첫째, '금속 배선 및 시드 레이어'입니다. 최상부 알루미늄 배선 증착에 쓰이며, 구리 배선 공정에서 전기도금을 유도하기 위해 얇게 깔아주는 구리 시드 레이어 증착에 필수적입니다. 둘째, '확산 방지막 및 라이너'입니다. 구리의 확산을 막는 탄탈륨 배리어층, 그리고 텅스텐 콘택트 홀 바닥에서 실리콘과 접촉 저항을 낮춰주는 Ti/TiN 티아이틴 라이너 증착에 사용됩니다. 셋째, '하드마스크'입니다. EUV 및 초미세 식각 시 PR을 지지하는 TiN 금속 하드마스크에 사용됩니다",
    "audio_q": "voices/questions/t_com03.mp3",
    "audio_a": "voices/lectures/t_com03.mp3"
  },
  {
    "id": "t_com04",
    "category": "AISK직무",
    "category_key": "tech",
    "question": "ALD(원자층증착)의 자기제어 반응 메커니즘 및 주요 적용 레이어",
    "answer": "ALD는 전구체와 반응가스를 시분할하여 주입하여 자기포화반응을 하는 증착 기술입니다. 표면의 반응 활성 자리가 모두 결합하면 반응이 멈추는 자기포화적/자기제한적 반응을 이용하므로, 옴스트롱 단위의 두께 제어를 할 수 있습니다. 100:1 이상의 높은 aspect ratio 구조에서도 100%에 가까운 완벽한 step coverage 특성을 지닙니다. ALD가 적용되는 주요 레이어는 극미세·초고단화가 요구되는 최첨단 소자 영역입니다. 첫째, high-k 절연막인 하프늄옥사이드와 지르코니아 산화막에 사용되는데요, 5nm 이하 FinFET 및 GAA 소자에서 양자역학적 터널링 누설 전류를 억제하기 위해 수 나노미터 두께로 극도로 균일하게 형성해야 합니다. 둘째, 'DRAM 캐패시터 초고유전막'입니다. 깊고 좁은 필라 형태의 초고종횡비 구조 내벽에 정전용량 확보를 위해 증착되는 ZrO2-Al2O3-ZrO2(ZAZ) 복합 유전체 박막에 적용됩니다. 셋째, '3D NAND 수직 채널 홀 게이트 스택'입니다. 200단~300단을 관통하는 수직 채널 홀 내벽에 균일하게 깔리는 블로킹 산화막, 전하 트랩 질화막, 터널 산화막 초미세 절연막을 형성합니다. 넷째, 'spacer lithography의 스페이서(SADP, SAQP)'입니다. 미세 피치 구현을 위해 기존 패턴 측벽에 극도로 일정한 두께로 형성하는 희생 산화막/질화막 스페이서 증착에 활용됩니다.",

    "question": "NAND 플래시 메모리의 기본 동작 원리",
    "answer": "NAND 플래시 메모리는 저장층의 전자 유무에 따라 문턱 전압(Vth)이 달라지는 원리로 데이터를 저장하는 비휘발성 메모리입니다. 3D NAND에서는 전자가 도망가지 못하도록 비전도성 질화막(SiN)에 전자를 가두는 CTF(Charge Trap Flash) 구조를 적용하고 있는 것으로 알고 있습니다. 핵심 동작은 프로그램, 이레이즈(Erase), 리드(Read) 세 가지로 이루어지는데요, 먼저 프로그램 동작은 전자를 트랩층 안에 넣는 과정입니다. 제어 게이트에 높은 전압을 인가하여 FN 터널링으로 전자를 주입합니다. 두 번째로 이레이즈(Erase, 소거) 동작은 반대로 갇혀 있는 전자를 밖으로 빼내는 과정인데요, 기판 쪽에 높은 전압을 걸어주면 트랩층에 있던 전자가 기판 쪽으로 빠져나옵니다. 그렇게 되면 문턱 전압이 낮아지면서 기존 트랜지스터 동작을 하며 데이터 1 상태가 기록됩니다. 마지막으로 리드 동작은 셀에 전자가 있는지 없는지를 확인하는 과정인데요, NAND 플래시는 셀들이 직렬로 연결된 스트링 구조이기 때문에 내가 읽고 싶은 셀 외의 다른 셀들은 무조건 다 켜져 있어야 통할 수가 있습니다. 그래서 비선택 셀들에는 높은 패스(Pass) 전압을 걸어 길을 열어두고, 내가 선택한 셀에만 기준 읽기 전압을 인가합니다. 전자가 있다면 문턱 전압이 높아 턴오프되어 데이터 0이 되고, 전자가 비어 있다면 채널이 켜져 전류가 흘러 데이터 1 상태를 읽어냅니다. 이 전류의 유무를 센스 앰프(Sense Amplifier)가 감지해 데이터를 읽어냅니다.",
    "audio_q": "voices/questions/t_01.mp3",
    "audio_a": "voices/lectures/t_01.mp3"
  },

    "answer": "메모리는 폰 노이만 구조에서 연산처리장치와 보조기억장치 간의 레이턴시(지연시간) 차이를 줄이면서 계층적 메모리 구조에서 고속 캐싱과 데이터 버퍼의 역할을 하는데요, CPU는 보조기억장치에 직접 접근해서 명령어를 실행할 수 없고 메모리의 주소를 참조해서 명령어를 인출하고 해독하고 실행하는 사이클을 수행합니다. CPU 동작주파수는 GHz 단위로 1사이클에 나노초(ns)가 소요되는 반면, NAND SSD는 접근 지연시간이 마이크로초(µs)입니다. 이 레이턴시의 차이를 해결하기 위해 계층적 메모리 구조에서 메모리가 역할을 하게 됩니다. CPU 내부에는 접근 속도가 빠른 SRAM 기반의 L1, L2, L3 캐시가 배치되고 바로 하위 계층에는 DRAM이 데이터를 공급하면서 계층적 메모리 구조가 구성됩니다. 그러나 최근 AI로 인해 GPU 연산량이 급증해 메모리 월(Memory Wall) 문제가 병목현상(Bottleneck)으로 대두되고 있는데요, GPU의 연산 능력은 발전한 반면 일반 DDR D램의 데이터 전송 버스폭은 64비트여서 메모리 월이 발생했습니다. 이것을 물리적으로 돌파하기 위한 혁신이 HBM입니다. HBM은 여러 개의 D램 다이(Die)를 수직으로 적층하고, 수천 개의 실리콘 관통 전극을 TSV 기술로 형성하여 신호 전송거리를 마이크로미터 수준으로 단축했습니다. 버스폭을 기존 64비트 대비 16배에 달하는 1024비트로 대폭 확장하여 초당 1TB 이상의 압도적인 데이터 대역폭을 달성했습니다.",
    "audio_q": "voices/questions/t_02.mp3",
    "audio_a": "voices/lectures/t_02.mp3"
  },

</script>
  <script>
    // 🚫 브라우저 기본 여성 아나운서 TTS 완전 원천 무력화
    if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
      window.speechSynthesis.speak = function() { console.warn('Browser TTS permanently disabled'); };
    }

    // App State
    let activeCategories = new Set(['experience', 'tech', 'personality']);
    let filteredList = [];
    let currentIndex = 0;
    let isPlaying = false;
    let isShuffle = true;
    let delaySeconds = 10;
    let autoScroll = true;
    let alwaysShowAnswer = false;
    let timerCountdown = null;
    let currentAudio = null;

    const cardListEl = document.getElementById('cardList');
    const dockStatusEl = document.getElementById('dockStatus');
    const timerBadgeEl = document.getElementById('timerBadge');
    const progressFillEl = document.getElementById('progressFill');
    const btnPlayMain = document.getElementById('btnPlayMain');
    const btnShuffle = document.getElementById('btnShuffle');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnAutoScroll = document.getElementById('btnAutoScroll');
    const btnShowAnsToggle = document.getElementById('btnShowAnsToggle');
    const delaySlider = document.getElementById('delaySlider');
    const delayVal = document.getElementById('delayVal');
    const statsPill = document.getElementById('statsPill');

    // 1. Filter logic
    function applyFilter() {
      filteredList = INTERVIEW_MATERIALS.filter(item => activeCategories.has(item.category_key));
      if (isShuffle) {
        filteredList.sort(() => Math.random() - 0.5);
      }
      currentIndex = 0;
      statsPill.innerText = `총 ${filteredList.length}문항`;
      renderCards();
    }

    function renderCards() {
      cardListEl.innerHTML = '';
      filteredList.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = `item-card ${alwaysShowAnswer ? 'show-ans' : ''}`;
        card.id = `card-${item.id}`;
        
        let catClass = 'cat-tech';
        if (item.category_key === 'experience') catClass = 'cat-exp';
        else if (item.category_key === 'personality') catClass = 'cat-pers';
        else if (item.category_key === 'notes') catClass = 'cat-note';

        card.innerHTML = `
          <div class="card-header">
            <span class="card-cat ${catClass}">#${idx+1} ${item.category}</span>
            <span style="font-size:11px; color:#64748b;">${item.id}</span>
          </div>
          <div class="card-q">${item.question}</div>
          <div class="card-a">${item.answer}</div>
        `;

        card.onclick = () => {
          currentIndex = idx;
          startItemPlayback();
        };

        cardListEl.appendChild(card);
      });
      updateActiveCard();
    }

    function updateActiveCard() {
      document.querySelectorAll('.item-card').forEach((c, idx) => {
        c.classList.remove('active', 'speaking-q', 'speaking-a');
        if (idx === currentIndex) {
          c.classList.add('active');
          if (autoScroll) {
            c.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
      });
    }

    // 2. Audio playback engine
    function stopCurrentAudio() {
      if (timerCountdown) {
        clearInterval(timerCountdown);
        timerCountdown = null;
      }
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.onended = null;
        currentAudio.onerror = null;
        currentAudio = null;
      }
      timerBadgeEl.style.display = 'none';
      progressFillEl.style.width = '0%';
    }

    async function startItemPlayback() {
      stopCurrentAudio();
      if (!isPlaying || currentIndex >= filteredList.length) {
        dockStatusEl.innerText = '재생이 정지되었습니다.';
        btnPlayMain.innerHTML = '▶';
        return;
      }

      const item = filteredList[currentIndex];
      updateActiveCard();
      const currentCardEl = document.getElementById(`card-${item.id}`);

      // Step A: Question Speech
      dockStatusEl.innerText = `🎙️ [질문] ${item.question.slice(0, 32)}...`;
      if (currentCardEl) currentCardEl.classList.add('speaking-q');

      await playAudioPromise(item.audio_q);

      if (!isPlaying) return;
      if (currentCardEl) currentCardEl.classList.remove('speaking-q');

      // Step B: Wait / Think Timer (0s ~ 60s)
      if (delaySeconds > 0) {
        timerBadgeEl.style.display = 'inline-block';
        let remain = delaySeconds;
        dockStatusEl.innerText = `⏳ 답변 준비 시간 (${remain}초 남음)...`;
        timerBadgeEl.innerText = `생각 시간: ${remain}s`;

        await new Promise(resolve => {
          timerCountdown = setInterval(() => {
            remain--;
            const pct = ((delaySeconds - remain) / delaySeconds) * 100;
            progressFillEl.style.width = `${pct}%`;
            timerBadgeEl.innerText = `생각 시간: ${remain}s`;
            if (remain <= 0 || !isPlaying) {
              clearInterval(timerCountdown);
              timerCountdown = null;
              timerBadgeEl.style.display = 'none';
              progressFillEl.style.width = '0%';
              resolve();
            }
          }, 1000);
        });
      }

      if (!isPlaying) return;

      // Step C: Answer Speech
      if (currentCardEl) {
        currentCardEl.classList.add('show-ans', 'speaking-a');
      }
      dockStatusEl.innerText = `📘 [모범답안] 내 목소리로 답변을 재생합니다...`;

      if (item.audio_a) {
        await playAudioPromise(item.audio_a);
      } else {
        // Audio not yet ready for this specific lecture item -> wait 3s gracefully
        await new Promise(r => setTimeout(r, 2500));
      }

      if (!isPlaying) return;
      if (currentCardEl) currentCardEl.classList.remove('speaking-a');

      // Step D: Next item
      currentIndex = (currentIndex + 1) % filteredList.length;
      setTimeout(() => {
        if (isPlaying) startItemPlayback();
      }, 1000);
    }

    // 전역 싱글톤 오디오 객체 (모바일 브라우저 권한 및 백그라운드 끊김 방지)
    const globalAudioEl = new Audio();
    globalAudioEl.preload = 'auto';

    function playAudioPromise(src) {
      return new Promise(resolve => {
        if (!src) {
          resolve();
          return;
        }
        stopCurrentAudio();
        currentAudio = globalAudioEl;
        
        let settled = false;
        const cleanupAndResolve = () => {
          if (settled) return;
          settled = true;
          globalAudioEl.onended = null;
          globalAudioEl.onerror = null;
          resolve();
        };

        globalAudioEl.onended = cleanupAndResolve;
        globalAudioEl.onerror = (e) => {
          console.warn('Audio play error for:', src, e);
          cleanupAndResolve();
        };

        // Cache-busting 및 경로 명확화
        globalAudioEl.src = src;
        globalAudioEl.currentTime = 0;

        const p = globalAudioEl.play();
        if (p && typeof p.catch === 'function') {
          p.catch(err => {
            console.warn('play() exception:', err);
            cleanupAndResolve();
          });
        }
      });
    }

    // Controls
    btnPlayMain.onclick = () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        btnPlayMain.innerHTML = '⏸';
        startItemPlayback();
      } else {
        btnPlayMain.innerHTML = '▶';
        stopCurrentAudio();
        dockStatusEl.innerText = '일시 정지됨';
      }
    };

    btnNext.onclick = () => {
      currentIndex = (currentIndex + 1) % filteredList.length;
      if (isPlaying) startItemPlayback();
      else updateActiveCard();
    };

    btnPrev.onclick = () => {
      currentIndex = (currentIndex - 1 + filteredList.length) % filteredList.length;
      if (isPlaying) startItemPlayback();
      else updateActiveCard();
    };

    btnShuffle.onclick = () => {
      isShuffle = !isShuffle;
      btnShuffle.style.borderColor = isShuffle ? 'var(--accent)' : 'var(--border)';
      btnShuffle.style.color = isShuffle ? 'var(--accent)' : 'var(--text)';
      applyFilter();
    };

    btnAutoScroll.onclick = () => {
      autoScroll = !autoScroll;
      btnAutoScroll.classList.toggle('active', autoScroll);
      btnAutoScroll.innerText = `📜 자동스크롤 ${autoScroll ? 'ON' : 'OFF'}`;
    };

    btnShowAnsToggle.onclick = () => {
      alwaysShowAnswer = !alwaysShowAnswer;
      btnShowAnsToggle.style.color = alwaysShowAnswer ? 'var(--a-color)' : 'var(--text)';
      document.querySelectorAll('.item-card').forEach(c => c.classList.toggle('show-ans', alwaysShowAnswer));
    };

    delaySlider.oninput = (e) => {
      delaySeconds = parseInt(e.target.value, 10);
      delayVal.innerText = delaySeconds;
    };

    // Filter chip clicks
    document.querySelectorAll('.chip').forEach(chip => {
      chip.onclick = () => {
        const cat = chip.dataset.cat;
        if (cat === 'all') {
          if (activeCategories.size === 4) activeCategories.clear();
          else activeCategories = new Set(['experience', 'tech', 'personality', 'notes']);
        } else {
          if (activeCategories.has(cat)) activeCategories.delete(cat);
          else activeCategories.add(cat);
        }
        document.querySelectorAll('.chip').forEach(c => {
          if (c.dataset.cat === 'all') c.classList.toggle('active', activeCategories.size === 4);
          else c.classList.toggle('active', activeCategories.has(c.dataset.cat));
        });
        applyFilter();
      };
    });

    // Init
    applyFilter();
  </script>
</body>
</html>
