<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🚗 차 안에서 듣는 모의면접 (내 목소리 전용 플레이어)</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131c2e;
      --card-active: #1d2a45;
      --accent: #38bdf8;
      --accent-rgb: 56, 189, 248;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #23334d;
      --q-color: #a5b4fc;
      --a-color: #34d399;
      --dock-bg: rgba(15, 23, 42, 0.95);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 240px;
      overflow-x: hidden;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 13, 22, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-car {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }
    .stats-pill {
      font-size: 13px;
      font-weight: 800;
      color: #34d399;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
    }
    
    /* Category Filter Chips */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .chip {
      background: #1e293b;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip.active {
      background: var(--accent);
      color: #04101e;
      border-color: var(--accent);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
    }

    /* Cards Stream */
    .card-list {
      max-width: 860px;
      margin: 16px auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
    }
    .item-card.active {
      border-color: var(--accent);
      background: var(--card-active);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.25);
      transform: scale(1.015);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .card-cat {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .cat-exp { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid #f59e0b; }
    .cat-tech { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid #38bdf8; }
    .cat-pers { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid #a855f7; }
    .cat-note { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid #10b981; }
    
    .card-q {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .card-a {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.65;
      background: rgba(0,0,0,0.25);
      padding: 12px 14px;
      border-radius: 8px;
      border-left: 3px solid var(--a-color);
      display: none;
    }
    .item-card.show-ans .card-a { display: block; }
    .item-card.speaking-q .card-q { color: var(--accent); }
    .item-card.speaking-a .card-a { border-left-color: var(--accent); background: rgba(56, 189, 248, 0.1); }

    /* Bottom Car-Mode Player Dock */
    .car-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--dock-bg);
      backdrop-filter: blur(18px);
      border-top: 1px solid var(--border);
      padding: 14px 20px calc(20px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.5);
    }
    .dock-container {
      max-width: 860px;
      margin: 0 auto;
    }
    .status-banner {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .timer-badge {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid #ef4444;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      display: none;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.1s linear;
    }
    
    /* Controls */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .btn-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-circle:active { transform: scale(0.92); }
    .btn-play-big {
      width: 68px;
      height: 68px;
      background: var(--accent);
      color: #090d16;
      border: none;
      font-size: 26px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }
    
    /* Config bar */
    .config-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      font-size: 12.5px;
      color: var(--text-muted);
    }
    .delay-slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type=range] {
      accent-color: var(--accent);
      width: 110px;
      cursor: pointer;
    }
    .toggle-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 600;
    }
    .toggle-btn.active {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
    }
  
    .audio-badge {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 12px;
      margin-left: 8px;
      font-weight: 600;
    }
    .audio-badge.ready {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .audio-badge.pending {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .card-cat.notes {
      color: #a78bfa;
      border-color: rgba(167, 139, 250, 0.4);
      background: rgba(167, 139, 250, 0.1);
    }

  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-top">
      <div class="header-title">
        <span>🚗 차 안 모의면접</span>
        <span class="badge-car">내 목소리 전용</span>
      </div>
      <div class="stats-pill" id="statsPill">0 / 0 문항</div>
    </div>
    <div class="filter-bar" id="filterBar">
      <div class="chip active" data-cat="all">전체 (150)</div>
      <div class="chip active" data-cat="experience">내경험기반 (20)</div>
      <div class="chip active" data-cat="tech">AISK직무 (36)</div>
      <div class="chip active" data-cat="personality">AISK인성 (50)</div>
      <div class="chip active" data-cat="notes">손글씨노트 (44)</div>
    </div>
  </header>

  <!-- Items Stream -->
  <main class="card-list" id="cardList"></main>

  <!-- Bottom Car Player Dock -->
  <footer class="car-dock">
    <div class="dock-container">
      <div class="status-banner">
        <span id="dockStatus">준비 완료 — 재생 버튼을 누르세요</span>
        <span class="timer-badge" id="timerBadge">생각 시간: 10s</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="controls-row">
        <button class="btn-circle" id="btnPrev" title="이전 질문">⏮️</button>
        <button class="btn-circle" id="btnShuffle" title="랜덤 재생 토글">🔀</button>
        <button class="btn-circle btn-play-big" id="btnPlayMain" title="재생/일시정지">▶</button>
        <button class="btn-circle" id="btnShowAnsToggle" title="답변 텍스트 항상 열기">👁️</button>
        <button class="btn-circle" id="btnNext" title="다음 질문">⏭️</button>
      </div>
      <div class="config-row">
        <div class="delay-slider-wrap">
          <span>생각 시간: <strong id="delayVal" style="color:var(--accent);">10</strong>초</span>
          <input type="range" id="delaySlider" min="0" max="60" step="5" value="10">
        </div>
        <button class="toggle-btn active" id="btnAutoScroll">📜 자동스크롤 ON</button>
      </div>
    </div>
  </footer>

  <script>
const INTERVIEW_MATERIALS = [
  {
    "id": "p_g07",
    "category": "AISK인성",
    "category_key": "personality",
    "question": "본인이 팀장인데 팀원이 팀의 방향과 다르게 업무를 진행하려 한다면 어떻게 설득하겠습니까?",
    "answer": "먼저 팀원의 독단적 행동을 질책하기보다, 1:1 대화를 통해 팀원만의 특별한 문제의식이나 새로운 아이디어가 있었는지 진심으로 경청하겠습니다. 현장에서만 체감한 비효율이나 새로운 시각이 존재할 수 있기 때문입니다.\n\n이후 팀 전체의 마일스톤과 고객사 요구사항이라는 최종 목표(KPI)를 객관적 데이터로 다시 얼라인(Align)하고, 팀원의 방식이 일정과 수율에 미칠 리스크를 투명하게 공유하겠습니다.\n\n만약 팀원의 제안이 타당하다면 팀의 방향에 부분적으로 융합하는 제3의 절충안을 도출하고, 그렇지 않다면 이번 과제는 합의된 기준대로 추진하되 팀원의 아이디어는 차기 개선 과제로 정식 디벨롭할 것을 약속하여 자발적 동참을 이끌어내겠습니다.",
    "audio_q": "voices/questions/p_g07.mp3",
    "audio_a": "voices/lectures/p_g07.mp3",
    "q_ready": true,
    "a_ready": true
  },
  {
    "id": "p_g08",
    "category": "AISK인성",
    "category_key": "personality",
    "question": "팀 프로젝트 마감이 임박한 상황에서 팀원 한 명이 잘못된 데이터를 사용해 전체 결과에 문제가 생겼다는 사실을 알게 되었다면 어떻게 하겠습니까?",
    "answer": "마감이 임박할수록 '누구의 탓인가'를 따지는 비난을 멈추고 '어떻게 즉시 수습할 것인가'에 집중하겠습니다.\n\n첫째, 해당 데이터로 인한 영향 범위를 즉시 격리(Containment)하고, 상사와 이해관계자에게 '데이터 오류 발생 사실과 재작업 소요 시간'을 숨김없이 투명하게 즉시 보고하겠습니다.\n\n둘째, 마감 내에 전체를 다시 할 수 없다면, 필수 핵심 결과물과 부가 항목을 분리하는 우선순위 재정렬을 거치고 팀원들과 역할을 재분담해 마감 기한을 최대한 준수하겠습니다.\n\n마지막으로, 실수한 팀원이 위축되지 않도록 격려하며 프로젝트 종료 후 데이터 추출 및 교차 검증(Cross-check) 프로세스를 표준화하여 재발을 원천 방지하겠습니다.",
    "audio_q": "voices/questions/p_g08.mp3",
    "audio_a": "voices/lectures/p_g08.mp3",
    "q_ready": true,
    "a_ready": true
  },
  {
    "id": "p_g09",
    "category": "AISK인성",
    "category_key": "personality",
    "question": "동료에게 피드백을 했는데 상대가 기분 나빠하며 소극적인 태도로 일관한다면 어떻게 해결하겠습니까?",
    "answer": "동료의 침묵과 소극적 태도는 피드백의 내용보다 제 전달 방식이나 타이밍에서 감정적 불편함을 느꼈기 때문이라고 생각합니다.\n\n먼저 반나절 정도 상대방의 감정적 냉각 시간을 존중한 뒤, 편안한 1:1 티타임 자리를 마련해 진솔하게 다가가겠습니다.\n\n'제가 결과에만 급급해 동료님의 노력과 입장을 충분히 헤아리지 못하고 전달했습니다'라고 제 표현 방식의 미숙함을 먼저 사과하겠습니다. 그리고 피드백의 진짜 의도가 '동료님을 비판하려는 것이 아니라 팀의 결과물을 함께 완성하기 위함'이었음을 차분히 설명하고, 상대방의 생각과 고충을 경청하여 신뢰를 다시 회복하겠습니다.",
    "audio_q": "voices/questions/p_g09.mp3",
    "audio_a": "voices/lectures/p_g09.mp3",
    "q_ready": true,
    "a_ready": true
  },
  {
    "id": "p_g10",
    "category": "AISK인성",
    "category_key": "personality",
    "question": "본인이 실수했고 다음 공정 엔지니어도 이를 확인하지 못해 고객에게까지 전달되어 문제가 발생했습니다. 상사가 누구의 잘못인지 묻는다면 어떻게 답하겠습니까?",
    "answer": "망설임 없이 '최초의 실수를 유발한 저의 명백한 잘못입니다'라고 솔직하게 제 책임을 100% 인정하겠습니다. 다음 공정 엔지니어가 걸러내지 못한 것은 2차적인 문제일 뿐, 근본적인 불량의 출발점은 제가 담당한 공정의 관리 소홀이었기 때문에 다음 공정에 책임을 전가하지 않겠습니다.\n\n다만, 개인의 처벌로 끝내지 않고 '왜 이 불량이 제 공정에서 발생했고, 왜 다음 공정 인터락 시스템에서도 필터링되지 않았는지'에 대해 공정 간 인수인계 데이터와 유출 메커니즘을 끝까지 분석하겠습니다.\n\n고객사 신뢰 회복을 위한 원인 분석 보고서와 2중 교차 검증 인터락 대책을 마련하여 상사께 함께 보고드리겠습니다.",
    "audio_q": "voices/questions/p_g10.mp3",
    "audio_a": "voices/lectures/p_g10.mp3",
    "q_ready": true,
    "a_ready": true
  },
  {
    "id": "p_g11",
    "category": "AISK인성",
    "category_key": "personality",
    "question": "본인의 실수로 하루 동안의 작업을 전부 다시 해야 한다면 누구에게 어떻게 보고하고 수습하겠습니까? 개인과 조직 차원의 개선 방안도 설명해 주세요.",
    "answer": "실수를 인지한 즉시 직속 상사께 3단계(발생 현황, 라인 및 납기 영향도, 구체적 수습 계획)로 가감 없이 즉시 보고하겠습니다. 실수를 숨기거나 혼자 만회하려다 타이밍을 놓치면 팹 전체의 생산 차질로 이어지기 때문입니다.\n\n수습을 위해 우선순위가 낮은 업무를 조정하고 야근이나 동료 지원을 정중히 요청해 당일 작업을 최단 시간 내 재수행하겠습니다.\n\n개인 차원에서는 작업 전후 핵심 파라미터를 3초간 확인하는 '지적확인 체크리스트'를 습관화하겠습니다.\n\n조직 차원에서는 한 사람의 단순 실수로 하루 작업이 날아가지 않도록, 휴먼 에러를 방지하는 작업 승인 인터락(Poka-Yoke)과 데이터 자동 백업 시스템을 구축하겠습니다.",
    "audio_q": "voices/questions/p_g11.mp3",
    "audio_a": "voices/lectures/p_g11.mp3",
    "q_ready": true,
    "a_ready": true
  },
  {
    "id": "p_g12",
    "category": "AISK인성",

    "answer": "건식 식각의 주류 기술인 RIE(Reactive Ion Etching, 반응성 이온 식각)는 화학적 라디칼 반응의 고속·고선택비 특성과 물리적 이온 충돌의 방향성 특성을 단일 챔버 내에서 시너지 결합하여 고품질의 수직 이방성 패턴을 형성하는 공정입니다. 플라즈마 내부에서 생성되는 두 핵심 요소의 물리적 역할은 다음과 같습니다. 첫째, '화학적 식각'입니다. 플라즈마 방전에 의해 분해된 반응성이 극도로 높은 중성 활성종입니다. 전기적으로 중성이므로 전계에 영향을 받지 않고 확산열역학적 농도 구배에 따라 표면에 흡착되어 휘발성 부산물을 생성하며 자발적으로 박막을 깎아냅니다. 식각 속도가 빠르고 화학적 선택비가 우수하지만, 무방향성 확산으로 인해 측벽을 파고드는 등방성 언더컷을 유발합니다. 둘째, '물리적 식각'입니다. 플라즈마 시스 전계에 의해 가속된 무거운 양이온입니다. 웨이퍼 표면을 수직으로 강력하게 타격하여 격자 결합을 기계적으로 파괴합니다. 완벽한 직진성을 부여하여 수직 프로파일을 만들지만, 식각율이 낮고 마스크까지 깎아내어 선택비가 낮고 기판 손상을 초래합니다. 셋째, 'RIE의 시너지 메커니즘(이온 보조 화학 식각)'입니다. 이온 충돌이 표면의 강한 원자 결합을 끊어 화학적 활성화 에너지를 낮춰주면 라디칼이 그 자리에 급속도로 반응하여 식각 속도가 각각의 단순 합보다 수십 배 증가합니다. 동시에 플라즈마 가스에서 생성된 탄소-불소계 폴리머가 패턴 측벽에 얇은 보호막을 형성합니다. 수직 이온은 바닥면의 보호막만 선택적으로 날려버리고 측벽 보호막은 유지되므로, 라디칼에 의한 측벽 공격이 완벽히 차단되어 수직 90도 프로파일이 완성됩니다. 양산 엔지니어는 소스 RF 파워로 라디칼 밀도를, 바이어스 RF 파워로 이온 에너지를 독립 제어하여 이방성과 선택비의 최적 밸런스를 확보합니다.",

    "answer": "TSV란? 기존의 Wire Bonding 을 대체하는 기술로, 이전에는 와이어를 이용해 적층했다면 TSV는 미세한 구멍을 뚫어 상하단 칩을 수직 연결하는 패키징 기술 . 장점 : 와이어 공간 필요 없음 In/Output unit 제한 없음 (대역폭 극대화) 패키지 크기 작음 칩 간의 Interconnection 길이를 감소시켜 집적도 ↑ 빠른 신호 전달 및 저전력 구현",

  </script>
  <script>
    // 🚫 브라우저 기본 여성 아나운서 TTS 완전 원천 무력화
    if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
      window.speechSynthesis.speak = function() { console.warn('Browser TTS permanently disabled'); };
    }

    // App State
    let activeCategories = new Set(['experience', 'tech', 'personality', 'notes']);
    let filteredList = [];
    let currentIndex = 0;
    let isPlaying = false;
    let isShuffle = true;
    let delaySeconds = 10;
    let autoScroll = true;
    let alwaysShowAnswer = false;
    let timerCountdown = null;
    let currentAudio = null;

    const cardListEl = document.getElementById('cardList');
    const dockStatusEl = document.getElementById('dockStatus');
    const timerBadgeEl = document.getElementById('timerBadge');
    const progressFillEl = document.getElementById('progressFill');
    const btnPlayMain = document.getElementById('btnPlayMain');
    const btnShuffle = document.getElementById('btnShuffle');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnAutoScroll = document.getElementById('btnAutoScroll');
    const btnShowAnsToggle = document.getElementById('btnShowAnsToggle');
    const delaySlider = document.getElementById('delaySlider');
    const delayVal = document.getElementById('delayVal');
    const statsPill = document.getElementById('statsPill');

    // 1. Filter logic
    function applyFilter() {
      filteredList = INTERVIEW_MATERIALS.filter(item => activeCategories.has(item.category_key));
      if (isShuffle) {
        filteredList.sort(() => Math.random() - 0.5);
      }
      currentIndex = 0;
      const readyCount = filteredList.filter(item => item.audio_a && item.a_ready).length;
      statsPill.innerHTML = `🎙️ ${readyCount} / ${filteredList.length}`;
      renderCards();
    }

    function renderCards() {
      cardListEl.innerHTML = '';
filteredList.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = `item-card ${alwaysShowAnswer ? 'show-ans' : ''}`;
        card.id = `card-${item.id}`;
        
        let catClass = 'exp';
        if (item.category_key === 'tech') catClass = 'tech';
        if (item.category_key === 'personality') catClass = 'pers';
        if (item.category_key === 'notes') catClass = 'notes';

        const audioBadge = item.audio_a 
          ? `<span class="audio-badge ready" title="내 목소리 답변 음성 준비 완료">🎙️ 내 목소리 완비</span>`
          : `<span class="audio-badge pending" title="음성 생성 중 - 텍스트로 즉시 학습 가능">⏳ 텍스트 학습</span>`;

        card.innerHTML = `
          <div class="card-header">
            <span class="card-cat ${catClass}">#${idx+1} ${item.category}</span>
            ${audioBadge}
          </div>
          <div class="card-q">${item.question}</div>
          <div class="card-a">${item.answer}</div>
        `;
        card.onclick = () => {
          currentIndex = idx;
          startItemPlayback();
        };
        cardListEl.appendChild(card);
      });
      updateActiveCard();
    }

    function updateActiveCard() {
      document.querySelectorAll('.item-card').forEach((c, idx) => {
        c.classList.remove('active', 'speaking-q', 'speaking-a');
        if (idx === currentIndex) {
          c.classList.add('active');
          if (autoScroll) {
            c.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
      });
    }

    // 2. Audio playback engine
    function stopCurrentAudio() {
      if (timerCountdown) {
        clearInterval(timerCountdown);
        timerCountdown = null;
      }
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.onended = null;
        currentAudio.onerror = null;
        currentAudio = null;
      }
      timerBadgeEl.style.display = 'none';
      progressFillEl.style.width = '0%';
    }

    async function startItemPlayback() {
      stopCurrentAudio();
      if (!isPlaying || currentIndex >= filteredList.length) {
        dockStatusEl.innerText = '재생이 정지되었습니다.';
        btnPlayMain.innerHTML = '▶';
        return;
      }

      const item = filteredList[currentIndex];
      updateActiveCard();
      const currentCardEl = document.getElementById(`card-${item.id}`);

      // Step A: Question Speech
      dockStatusEl.innerText = `🎙️ [질문] ${item.question.slice(0, 32)}...`;
      if (currentCardEl) currentCardEl.classList.add('speaking-q');

      await playAudioPromise(item.audio_q);

      if (!isPlaying) return;
      if (currentCardEl) currentCardEl.classList.remove('speaking-q');

      // Step B: Wait / Think Timer (0s ~ 60s)
      if (delaySeconds > 0) {
        timerBadgeEl.style.display = 'inline-block';
        let remain = delaySeconds;
        dockStatusEl.innerText = `⏳ 답변 준비 시간 (${remain}초 남음)...`;
        timerBadgeEl.innerText = `생각 시간: ${remain}s`;

        await new Promise(resolve => {
          timerCountdown = setInterval(() => {
            remain--;
            const pct = ((delaySeconds - remain) / delaySeconds) * 100;
            progressFillEl.style.width = `${pct}%`;
            timerBadgeEl.innerText = `생각 시간: ${remain}s`;
            if (remain <= 0 || !isPlaying) {
              clearInterval(timerCountdown);
              timerCountdown = null;
              timerBadgeEl.style.display = 'none';
              progressFillEl.style.width = '0%';
              resolve();
            }
          }, 1000);
        });
      }

      if (!isPlaying) return;

// Step C: Answer Speech
      if (currentCardEl) {
        currentCardEl.classList.add('show-ans', 'speaking-a');
      }

      if (item.audio_a) {
        dockStatusEl.innerText = `📘 [모범답안] 내 목소리로 답변을 재생합니다...`;
        await playAudioPromise(item.audio_a);
      } else {
        dockStatusEl.innerText = `📘 [모범답안] 텍스트를 읽고 넘어갑니다 (3초)...`;
        await new Promise(r => setTimeout(r, 3500));
      }

      if (!isPlaying) return;
      if (currentCardEl) currentCardEl.classList.remove('speaking-a');

      // Step D: Next item
      currentIndex = (currentIndex + 1) % filteredList.length;
      setTimeout(() => {
        if (isPlaying) startItemPlayback();
      }, 1000);
    }

    // 전역 싱글톤 오디오 객체 (모바일 브라우저 권한 및 백그라운드 끊김 방지)
    const globalAudioEl = new Audio();
    globalAudioEl.preload = 'auto';

    function playAudioPromise(src) {
      return new Promise(resolve => {
        if (!src) {
          resolve();
          return;
        }
        stopCurrentAudio();
        currentAudio = globalAudioEl;
        
        let settled = false;
        const cleanupAndResolve = () => {
          if (settled) return;
          settled = true;
          globalAudioEl.onended = null;
          globalAudioEl.onerror = null;
          resolve();
        };

        globalAudioEl.onended = cleanupAndResolve;
        globalAudioEl.onerror = (e) => {
          console.warn('Audio play error for:', src, e);
          cleanupAndResolve();
        };

        // Cache-busting 및 경로 명확화
        globalAudioEl.src = src;
        globalAudioEl.currentTime = 0;

        const p = globalAudioEl.play();
        if (p && typeof p.catch === 'function') {
          p.catch(err => {
            console.warn('play() exception:', err);
            cleanupAndResolve();
          });
        }
      });
    }

    // Controls
    btnPlayMain.onclick = () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        btnPlayMain.innerHTML = '⏸';
        startItemPlayback();
      } else {
        btnPlayMain.innerHTML = '▶';
        stopCurrentAudio();
        dockStatusEl.innerText = '일시 정지됨';
      }
    };

    btnNext.onclick = () => {
      currentIndex = (currentIndex + 1) % filteredList.length;
      if (isPlaying) startItemPlayback();
      else updateActiveCard();
    };

    btnPrev.onclick = () => {
      currentIndex = (currentIndex - 1 + filteredList.length) % filteredList.length;
      if (isPlaying) startItemPlayback();
      else updateActiveCard();
    };

    btnShuffle.onclick = () => {
      isShuffle = !isShuffle;
      btnShuffle.style.borderColor = isShuffle ? 'var(--accent)' : 'var(--border)';
      btnShuffle.style.color = isShuffle ? 'var(--accent)' : 'var(--text)';
      applyFilter();
    };

    btnAutoScroll.onclick = () => {
      autoScroll = !autoScroll;
      btnAutoScroll.classList.toggle('active', autoScroll);
      btnAutoScroll.innerText = `📜 자동스크롤 ${autoScroll ? 'ON' : 'OFF'}`;
    };

    btnShowAnsToggle.onclick = () => {
      alwaysShowAnswer = !alwaysShowAnswer;
      btnShowAnsToggle.style.color = alwaysShowAnswer ? 'var(--a-color)' : 'var(--text)';
      document.querySelectorAll('.item-card').forEach(c => c.classList.toggle('show-ans', alwaysShowAnswer));
    };

    delaySlider.oninput = (e) => {
      delaySeconds = parseInt(e.target.value, 10);
      delayVal.innerText = delaySeconds;
    };

    // Filter chip clicks
    document.querySelectorAll('.chip').forEach(chip => {
      chip.onclick = () => {
        const cat = chip.dataset.cat;
        if (cat === 'all') {
          if (activeCategories.size === 4) activeCategories.clear();
          else activeCategories = new Set(['experience', 'tech', 'personality', 'notes']);
        } else {
          if (activeCategories.has(cat)) activeCategories.delete(cat);
          else activeCategories.add(cat);
        }
        document.querySelectorAll('.chip').forEach(c => {
          if (c.dataset.cat === 'all') c.classList.toggle('active', activeCategories.size === 4);
          else c.classList.toggle('active', activeCategories.has(c.dataset.cat));
        });
        applyFilter();
      };
    });

    // Init
    applyFilter();
  </script>
</body>
