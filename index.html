<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>SK하이닉스 AISK 심층 대비 마스터 백과사전 (커스텀 편집 & 문항 추가 지원)</title>
  
  <!-- Pretendard & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  
  <!-- KaTeX for Semiconductor Physics Formulas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg-body: #090d16;
      --bg-card: #111827;
      --bg-sidebar: #0f172a;
      --bg-elevated: #1e293b;
      --border: #1e293b;
      --border-focus: #38bdf8;
      
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #64748b;
      
      --accent-blue: #38bdf8;
      --accent-indigo: #6366f1;
      --accent-amber: #f59e0b;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 사이드바 접힘 제어 */
    body.sidebar-collapsed aside {
      transform: translateX(-100%);
    }
    body.sidebar-collapsed main {
      margin-left: 0;
      max-width: 100%;
      padding: 40px 80px 120px;
    }
    body.sidebar-collapsed .drawer-float-open-btn {
      display: inline-flex;
    }

    .drawer-float-open-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 99;
      background: #0f172a;
      border: 1.5px solid var(--accent-blue);
      color: var(--accent-blue);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      transition: all 0.2s ease;
    }
    .drawer-float-open-btn:hover {
      background: var(--accent-blue);
      color: #0f172a;
      transform: translateY(-2px);
    }

    /* 좌측 사이드바 */
    aside {
      width: 380px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      z-index: 50;
      box-shadow: var(--shadow-lg);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar-header {
      padding: 20px 20px 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0) 100%);
    }

    .sidebar-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .sidebar-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-collapse {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--accent-blue);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-collapse:hover {
      background: var(--accent-blue);
      color: #0f172a;
    }

    .sidebar-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* 사이드바 액션 바 (신규 추가 & 백업) */
    .sidebar-action-bar {
      display: flex;
      gap: 6px;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid var(--border);
    }

    .btn-sidebar-action {
      flex: 1;
      padding: 7px 6px;
      font-size: 0.76rem;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--text-sub);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-sidebar-action:hover {
      background: #334155;
      color: #ffffff;
      border-color: var(--accent-blue);
    }
    .btn-sidebar-action.primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      border-color: #38bdf8;
    }
    .btn-sidebar-action.primary:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
    }

    /* 카테고리 필터 칩 */
    .filter-tabs {
      display: flex;
      gap: 6px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.4);
    }

    .filter-chip {
      flex: 1;
      padding: 6px 4px;
      font-size: 0.77rem;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--text-sub);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .filter-chip:hover {
      border-color: var(--accent-blue);
      color: var(--text-main);
    }
    .filter-chip.active {
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
    }

    .search-box {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }

    .search-input {
      width: 100%;
      padding: 9px 13px;
      background-color: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 0.84rem;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px;
      list-style: none;
    }
    .nav-list::-webkit-scrollbar {
      width: 5px;
    }
    .nav-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .nav-item {
      margin-bottom: 4px;
    }

    .nav-link {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 12px;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.84rem;
      line-height: 1.4;
      font-weight: 500;
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
    }
    .nav-link:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--accent-blue);
      transform: translateX(3px);
    }
    .nav-link.active {
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.18), rgba(99, 102, 241, 0.08));
      color: var(--accent-blue);
      font-weight: 700;
      border-left: 3px solid var(--accent-blue);
    }

    .nav-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      margin-top: 1px;
    }
    .cat-badge-p {
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .cat-badge-t {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .cat-badge-c {
      color: #10b981;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .nav-text {
      flex: 1;
      word-break: keep-all;
    }

    /* 메인 컨텐츠 영역 */
    main {
      margin-left: 380px;
      flex: 1;
      padding: 40px 60px 120px;
      max-width: 1300px;
      transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 헤더 및 스톱워치 위젯 */
    .main-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 34px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .header-left {
      flex: 1;
      min-width: 320px;
    }

    .badge-top {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 20px;
      color: var(--accent-blue);
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .main-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.25;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .main-desc {
      font-size: 0.98rem;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .header-btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-header {
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--text-sub);
      transition: all 0.2s;
    }
    .btn-header:hover {
      background: #334155;
      color: #ffffff;
      border-color: var(--accent-blue);
    }
    .btn-header.primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }
    .btn-header.primary:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      transform: translateY(-1px);
    }

    /* 1분 30초 실전 스톱워치 위젯 */
    .timer-widget {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      border-radius: var(--radius-md);
      padding: 16px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 260px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    .timer-header {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-blue);
      margin-bottom: 8px;
    }

    .timer-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      margin-bottom: 10px;
    }
    .timer-display.warning {
      color: #ef4444;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }

    .timer-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .timer-btn {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #334155;
      color: #ffffff;
      transition: all 0.15s;
    }
    .timer-btn:hover {
      background: #475569;
    }
    .timer-btn.start {
      background: #0284c7;
      border-color: #38bdf8;
    }
    .timer-btn.start:hover {
      background: #0369a1;
    }

    .timer-progress-bar {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
    }
    .timer-progress {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #10b981, #38bdf8);
      transition: width 1s linear;
    }
    .timer-progress.warning {
      background: #ef4444;
    }

    /* 질문 카드 스타일 */
    .topic-section {
      background-color: var(--bg-card);
      border: 1cm solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px 36px;
      margin-bottom: 46px;
      box-shadow: var(--shadow-md);
      scroll-margin-top: 30px;
      transition: all 0.25s ease;
      position: relative;
    }
    .topic-section:hover {
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: var(--shadow-lg);
    }

    .topic-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }

    .topic-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .topic-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .category-chip {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sub);
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 9px;
      border-radius: 6px;
    }

    .kw-container {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .kw-pill {
      font-size: 0.75rem;
      color: #94a3b8;
      background: rgba(148, 163, 184, 0.1);
      padding: 2px 7px;
      border-radius: 4px;
    }

    /* 카드 액션 버튼 그룹 (수정, 삭제, 복사) */
    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-card-action {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border);
      color: var(--text-sub);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .btn-card-action:hover {
      background: #334155;
      color: #ffffff;
      border-color: var(--accent-blue);
    }
    .btn-card-action.edit-btn:hover {
      color: var(--accent-blue);
      border-color: var(--accent-blue);
    }
    .btn-card-action.delete-btn:hover {
      color: #f87171;
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }

    .speech-len-tag {
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .speech-len-tag strong {
      color: var(--accent-emerald);
    }

    .topic-title {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.4;
      margin-bottom: 24px;
      color: #f8fafc;
    }

    /* 1분 30초 실전 핵심 전달 상자 */
    .speech-card {
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.12) 0%, rgba(99, 102, 241, 0.12) 100%);
      border: 1.5px solid #0284c7;
      border-radius: var(--radius-md);
      padding: 22px 26px;
      margin-bottom: 28px;
      box-shadow: 0 4px 20px rgba(2, 132, 199, 0.15);
    }

    .speech-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .speech-card-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #0284c7;
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 6px;
      letter-spacing: 0.02em;
    }

    .speech-body {
      font-size: 1.05rem;
      line-height: 1.85;
      color: #f1f5f9;
      word-break: keep-all;
      letter-spacing: -0.01em;
      font-weight: 500;
    }

    .speech-guide-footer {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed rgba(56, 189, 248, 0.3);
    }
    .guide-tip {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    /* 아키텍처 다이어그램 영역 */
    .diagram-section {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 28px;
    }

    .diagram-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 14px;
    }

    .svg-container svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    /* 세부 마스터 강의 노트 */
    .lecture-box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px 28px;
    }

    .lecture-header {
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .lecture-item {
      margin-bottom: 22px;
    }
    .lecture-item:last-child {
      margin-bottom: 0;
    }

    .lecture-sub-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-blue);
      margin-bottom: 8px;
    }

    .lecture-desc {
      font-size: 0.92rem;
      color: var(--text-sub);
      line-height: 1.65;
    }

    .principle-box {
      background: rgba(30, 41, 59, 0.5);
      border-left: 3px solid var(--accent-indigo);
      border-radius: 0 6px 6px 0;
      padding: 12px 16px;
      font-size: 0.9rem;
      line-height: 1.7;
      color: #e2e8f0;
    }

    .core-pts-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }
    .core-pts-list li {
      position: relative;
      padding-left: 20px;
      font-size: 0.9rem;
      color: var(--text-sub);
      line-height: 1.6;
    }
    .core-pts-list li::before {
      content: "✔";
      position: absolute;
      left: 0;
      top: 0;
      color: var(--accent-emerald);
      font-weight: 800;
    }

    /* ========================================================
       인라인 편집 모드 폼 스타일 (In-Place Edit Form)
       ======================================================== */
    .edit-form-wrap {
      background: #1e293b;
      border: 2px solid var(--accent-blue);
      border-radius: var(--radius-lg);
      padding: 30px;
      margin-bottom: 46px;
      box-shadow: 0 10px 35px rgba(2, 132, 199, 0.35);
    }

    .edit-form-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.3);
    }

    .edit-form-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 7px;
    }

    .form-label .char-counter {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent-emerald);
      margin-left: 8px;
    }
    .form-label .char-counter.warn {
      color: var(--accent-amber);
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: var(--radius-sm);
      color: #f8fafc;
      font-size: 0.92rem;
      outline: none;
      transition: all 0.2s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .form-textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.6;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #334155;
    }

    .btn-submit {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 9px 20px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
    }

    .btn-cancel {
      background: #334155;
      color: var(--text-sub);
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-cancel:hover {
      background: #475569;
      color: #ffffff;
    }

    /* ========================================================
       신규 문항 추가 모달 (Add Item Modal)
       ======================================================== */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: #111827;
      border: 2px solid var(--accent-blue);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 780px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      animation: modalFadeIn 0.25s ease;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      padding: 20px 26px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .modal-close-btn:hover {
      color: #ffffff;
      background: #334155;
    }

    .modal-body {
      padding: 24px 26px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-body::-webkit-scrollbar {
      width: 6px;
    }
    .modal-body::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    /* 복사 토스트 */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #10b981;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2000;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 900px) {
      aside {
        transform: translateX(-100%);
      }
      body.sidebar-open aside {
        transform: translateX(0);
      }
      main {
        margin-left: 0;
        padding: 30px 20px 80px;
      }
      .drawer-float-open-btn {
        display: inline-flex;
      }
      .main-header {
        flex-direction: column;
      }
      .timer-widget {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- 모바일 및 사이드바 닫힘 시 플로팅 버튼 -->

  <!-- 좌측 사이드바 -->
  <aside id="sidebar">

          접기

    <!-- 사이드바 상단 빠른 액션 바 -->
    <div class="sidebar-action-bar">
      <button class="btn-sidebar-action primary" onclick="openAddModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>

      </button>
      <button class="btn-sidebar-action" onclick="exportDataJSON()" title="수정된 데이터 JSON 백업 다운로드">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>

    <!-- 카테고리 필터 탭 -->
    <div class="filter-tabs">
      <button class="filter-chip active" data-filter="all" id="tabAll">전체 (40)</button>
      <button class="filter-chip" data-filter="personality" id="tabPersonality">인성·협업 (20)</button>
      <button class="filter-chip" data-filter="tech" id="tabTech">직무·소자 (20)</button>
    </div>

    <!-- 실시간 검색창 -->
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="키워드, 문항 번호, 제목 검색..." autocomplete="off">
    </div>

    <!-- 목차 리스트 -->
    <ul class="nav-list" id="navList">
      <!-- JavaScript로 동적 렌더링 -->
    </ul>
  </aside>

  <!-- 메인 본문 -->
  <main>
    <header class="main-header">
      <div class="header-left">
        <div class="badge-top">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          SK hynix AISK 실전 대비 백과사전
        </div>
        <h1 class="main-title">SK하이닉스 AISK 심층 대비 마스터</h1>
        <p class="main-desc">
          인성·협업 가치와 소자·공정 실전 핵심 문항을 마스터하는 인터랙티브 학습 시스템입니다.<br>
          각 카드에서 <strong>[✏️ 수정]</strong>을 눌러 직접 제목과 내용을 편집할 수 있으며, <strong>[➕ 신규 항목 추가]</strong>로 나만의 문항을 무제한 등록하고 영구 보존할 수 있습니다.
        </p>

        <div class="header-btn-group">
          <button class="btn-header primary" onclick="openAddModal()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            신규 항목 추가하기
          </button>
          <button class="btn-header" onclick="exportDataJSON()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            JSON 데이터 백업
          </button>
          <button class="btn-header" onclick="resetToDefault()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
            기본값 복원
          </button>

      </div>

      <!-- 1분 30초 실전 스톱워치 위젯 -->
      <div class="timer-widget">

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          1분 30초 실전 타이머
        </div>

    <!-- 문항 카드 컨테이너 -->
    <div id="topicContainer">
      <!-- JavaScript로 동적 렌더링 -->
    </div>
  </main>

  <!-- 신규 문항 추가 모달 (Modal) -->
  <div class="modal-backdrop" id="addModalBackdrop">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          신규 항목 추가
        </div>
        <button class="modal-close-btn" onclick="closeAddModal()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="addForm" onsubmit="submitNewTopic(event)">
          <div class="form-group">
            <label class="form-label">분류 카테고리</label>
            <select class="form-select" id="newCategory" required>
              <option value="personality">인성·협업·조직 가치</option>
              <option value="tech">반도체 소자·공정 실전 핵심</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">문항 제목</label>
            <input type="text" class="form-input" id="newTitle" placeholder="예: HBM4 16단 적층 시 발생하는 열적 휨(Warpage) 제어 방안" required>
          </div>

          <div class="form-group">
            <label class="form-label">핵심 키워드 (쉼표로 구분)</label>
            <input type="text" class="form-input" id="newKeywords" placeholder="예: TSV 본딩, CTE 불일치, 하이브리드 본딩">
          </div>

          <div class="form-group">
            <label class="form-label">
              1분 30초 실전 핵심 전달 (구어체)
              <span class="char-counter" id="newSpeechCounter">0자 (권장 380~450자)</span>
            </label>
            <textarea class="form-textarea" id="newSpeech" style="min-height: 140px;" placeholder="실전에서 1분 30초 동안 청자에게 전달할 구어체 내용을 입력하십시오." required oninput="updateSpeechCounter('newSpeech', 'newSpeechCounter')"></textarea>
          </div>



          <div class="form-actions">
            <button type="button" class="btn-cancel" onclick="closeAddModal()">취소</button>
            <button type="submit" class="btn-submit">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
              등록 완료
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">알림</div>

  <script>
    // 원천 기본 데이터 (JSON)
    const DEFAULT_TOPICS = [];

    const STORAGE_KEY = 'aisk_master_topics_custom_v2';
    let currentTopics = [];

    // 1. 초기 데이터 로드 (localStorage 우선)
    function loadTopics() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          currentTopics = JSON.parse(saved);
        } catch (e) {
          console.error('로컬스토리지 파싱 실패, 기본값 사용', e);
          currentTopics = JSON.parse(JSON.stringify(DEFAULT_TOPICS));
        }
      } else {
        currentTopics = JSON.parse(JSON.stringify(DEFAULT_TOPICS));
      }
    }

    function saveTopicsToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(currentTopics));
    }

    // 2. 전체 대시보드 렌더링
    function renderDashboard() {
      renderSidebar();
      renderCards();
      updateCounters();
      applyFilterAndSearch();
      renderMath();
    }

    // 카운터 업데이트
    function updateCounters() {
      const totalCount = currentTopics.length;
      const pCount = currentTopics.filter(t => t.category === 'personality').length;
      const tCount = currentTopics.filter(t => t.category === 'tech').length;

      document.getElementById('tabAll').textContent = `전체 (${totalCount})`;
      document.getElementById('tabPersonality').textContent = `인성·협업 (${pCount})`;
      document.getElementById('tabTech').textContent = `직무·소자 (${tCount})`;
    }

    // 사이드바 렌더링
    function renderSidebar() {
      const navList = document.getElementById('navList');
      if (currentTopics.length === 0) {
        navList.innerHTML = '<div style="padding: 30px 16px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">등록된 문항이 없습니다.</div>';
        return;
      }
      let html = '';

      currentTopics.forEach((t, index) => {
        const cat = t.category;
        const num = t.number || (index + 1);
        const title = escapeHtml(t.title);
        const keywordsStr = (t.core_keyword || []).join(' ');
        
        let numStr = '';
        let badgeClass = '';
        if (cat === 'personality') {
          numStr = `인성-${String(num).padStart(2, '0')}`;
          badgeClass = 'cat-badge-p';
        } else {
          numStr = `직무-${String(num).padStart(2, '0')}`;
          badgeClass = 'cat-badge-t';
        }

        html += `
          <li class="nav-item" data-category="${cat}" data-search="${title} ${escapeHtml(keywordsStr)} ${numStr}">
            <a href="#${t.id}" class="nav-link" id="link-${t.id}">
              <span class="nav-num ${badgeClass}">${numStr}</span>
              <span class="nav-text">${title}</span>
            </a>
          </li>
        `;
      });

      navList.innerHTML = html;
    }

    // 메인 카드 렌더링
    function renderCards() {
      const container = document.getElementById('topicContainer');
      if (currentTopics.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 70px 24px; color: var(--text-muted); background: var(--bg-card); border-radius: var(--radius-lg); border: 2px dashed var(--border); margin-top: 20px;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 16px; opacity: 0.6;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <h3 style="font-size: 1.25rem; color: var(--text-main); margin-bottom: 8px;">등록된 문항이 없습니다</h3>
            <p style="font-size: 0.92rem; color: var(--text-sub); margin-bottom: 24px;">인성 및 직무 문항이 모두 초기화되었습니다.<br>상단의 '+ 신규 문항 추가' 버튼을 눌러 새로운 문항을 작성해보세요.</p>
            <button class="btn-primary" onclick="openAddModal()" style="display: inline-flex; align-items: center; gap: 8px; margin: 0 auto; cursor: pointer;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              신규 문항 추가하기
            </button>
          </div>
        `;
        return;
      }
      let html = '';

      currentTopics.forEach((t, index) => {
        const cat = t.category;
        const catLabel = t.category_label || (cat === 'personality' ? '인성·협업·조직 가치' : '반도체 소자·공정 실전 핵심');
        const num = t.number || (index + 1);
        const title = escapeHtml(t.title);
        const speech = t.speech_1m30s || '';
        const speechCharCount = speech.length;
        const lecture = t.deep_lecture || {};
        const keywords = t.core_keyword || [];
        const svg = t.svg_diagram || getDefaultSvg(keywords, title);

        let numStr = '';
        let badgeClass = '';
        if (cat === 'personality') {
          numStr = `인성-${String(num).padStart(2, '0')}`;
          badgeClass = 'cat-badge-p';
        } else {
          numStr = `직무-${String(num).padStart(2, '0')}`;
          badgeClass = 'cat-badge-t';
        }

        const kwPills = keywords.map(kw => `<span class="kw-pill">#${escapeHtml(kw)}</span>`).join('');
        const corePtsHtml = (lecture.core_points || []).map(pt => `<li>${escapeHtml(pt)}</li>`).join('');
        const actionPrincipleHtml = (lecture.action_principle || '').replace(/\n/g, '<br>');

        html += `
          <section class="topic-section" id="${t.id}" data-category="${cat}">
            <div id="view-${t.id}">
              <div class="topic-header">
                <div class="topic-title-wrap">
                  <span class="topic-badge ${badgeClass}">${numStr}</span>
                  <span class="category-chip">${escapeHtml(catLabel)}</span>
                  <div class="kw-container">${kwPills}</div>
                </div>

                <div class="card-actions">
                  <div class="speech-len-tag">실전 호흡: <strong>${speechCharCount}자</strong></div>
                  <button class="btn-card-action edit-btn" onclick="startEdit('${t.id}')" title="제목 및 본문 수정">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
                    수정
                  </button>
                  <button class="btn-card-action delete-btn" onclick="deleteTopic('${t.id}')" title="이 문항 삭제">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    삭제
                  </button>
                </div>
              </div>

              <h2 class="topic-title">${title}</h2>

              <!-- 1분 30초 실전 핵심 전달 카드 -->
              <div class="speech-card">
                <div class="speech-card-header">
                  <div class="speech-card-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                    <span>1분 30초 실전 핵심 전달 (구어체 최적화 호흡)</span>
                  </div>
                  <button class="btn-card-action" onclick="copySpeech('${t.id}')" title="답변 복사">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    복사
                  </button>
                </div>
                <div class="speech-body" id="speech-text-${t.id}">
                  ${escapeHtml(speech)}
                </div>
                <div class="speech-guide-footer">
                  <span class="guide-tip">💡 팁: 첫 10초에 두괄식 핵심 메시지를 각인시키고, 60초간 구체적 데이터·원리를 전개한 후, 마지막 20초에 양산 수율 기여로 완결합니다.</span>
                </div>
              </div>


            </div>

            <!-- 인라인 편집 폼 컨테이너 (숨김 상태) -->
            <div id="edit-form-wrap-${t.id}" style="display: none;"></div>
          </section>
        `;
      });

      container.innerHTML = html;
      setupObserver();
    }

    // 기본 SVG 다이어그램 생성기 (신규 항목용)
    function getDefaultSvg(keywords, title) {
      const kw1 = escapeHtml(keywords[0] || '1. 핵심 가설/원인');
      const kw2 = escapeHtml(keywords[1] || '2. 공학적 솔루션');
      const kw3 = escapeHtml(keywords[2] || '3. 양산 수율 달성');

      return `<svg viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="240" fill="#0f172a" rx="12"/>
  <rect x="40" y="45" width="220" height="150" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
  <text x="150" y="80" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle">Step 1</text>
  <text x="150" y="125" fill="#cbd5e1" font-size="13" text-anchor="middle">${kw1}</text>

  <path d="M 275 120 L 315 120" stroke="#f59e0b" stroke-width="3"/>

  <rect x="330" y="45" width="230" height="150" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="445" y="80" fill="#f59e0b" font-size="15" font-weight="bold" text-anchor="middle">Step 2</text>
  <text x="445" y="125" fill="#cbd5e1" font-size="13" text-anchor="middle">${kw2}</text>

  <path d="M 575 120 L 615 120" stroke="#10b981" stroke-width="3"/>

  <rect x="630" y="45" width="130" height="150" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
  <text x="695" y="80" fill="#10b981" font-size="15" font-weight="bold" text-anchor="middle">Step 3</text>
  <text x="695" y="125" fill="#cbd5e1" font-size="13" text-anchor="middle">${kw3}</text>
</svg>`;
    }

    // ========================================================
    // 3. 인라인 편집 기능 (In-place Edit)
    // ========================================================
    function startEdit(id) {
      const topic = currentTopics.find(t => t.id === id);
      if (!topic) return;

      const viewEl = document.getElementById(`view-${id}`);
      const editWrap = document.getElementById(`edit-form-wrap-${id}`);

      viewEl.style.display = 'none';
      editWrap.style.display = 'block';

      const keywordsStr = (topic.core_keyword || []).join(', ');
      const pointsStr = ((topic.deep_lecture || {}).core_points || []).join('\n');

      editWrap.innerHTML = `
        <div class="edit-form-wrap">
          <div class="edit-form-header">
            <div class="edit-form-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
              문항 편집 모드
            </div>
            <span style="font-size: 0.8rem; color: #94a3b8;">수정 후 저장 시 로컬에 즉시 영구 저장됩니다.</span>
          </div>

          <div class="form-group">
            <label class="form-label">분류 카테고리</label>
            <select class="form-select" id="edit-cat-${id}">
              <option value="personality" ${topic.category === 'personality' ? 'selected' : ''}>인성·협업·조직 가치</option>
              <option value="tech" ${topic.category === 'tech' ? 'selected' : ''}>반도체 소자·공정 실전 핵심</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">문항 제목</label>
            <input type="text" class="form-input" id="edit-title-${id}" value="${escapeHtml(topic.title)}" required>
          </div>

          <div class="form-group">
            <label class="form-label">핵심 키워드 (쉼표 구분)</label>
            <input type="text" class="form-input" id="edit-kw-${id}" value="${escapeHtml(keywordsStr)}">
          </div>

          <div class="form-group">
            <label class="form-label">
              1분 30초 실전 핵심 전달 (구어체)
              <span class="char-counter" id="edit-counter-${id}">${topic.speech_1m30s.length}자 (권장 380~450자)</span>
            </label>
            <textarea class="form-textarea" id="edit-speech-${id}" style="min-height: 140px;" oninput="updateSpeechCounter('edit-speech-${id}', 'edit-counter-${id}')">${escapeHtml(topic.speech_1m30s)}</textarea>
          </div>



          <div class="form-actions">
            <button class="btn-cancel" onclick="cancelEdit('${id}')">취소</button>
            <button class="btn-submit" onclick="saveEdit('${id}')">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
              저장 완료
            </button>
          </div>
        </div>
      `;
    }

    function cancelEdit(id) {
      const viewEl = document.getElementById(`view-${id}`);
      const editWrap = document.getElementById(`edit-form-wrap-${id}`);
      if (viewEl && editWrap) {
        editWrap.style.display = 'none';
        editWrap.innerHTML = '';
        viewEl.style.display = 'block';
      }
    }

    function saveEdit(id) {
      const topic = currentTopics.find(t => t.id === id);
      if (!topic) return;

      const newCat = document.getElementById(`edit-cat-${id}`).value;
      const newTitle = document.getElementById(`edit-title-${id}`).value.trim();
      const newKw = document.getElementById(`edit-kw-${id}`).value.split(',').map(s => s.trim()).filter(Boolean);
      const newSpeech = document.getElementById(`edit-speech-${id}`).value.trim();
      const bgEl = document.getElementById(`edit-bg-${id}`);
      const newBg = bgEl ? bgEl.value.trim() : (topic.deep_lecture?.background || '');
      const principleEl = document.getElementById(`edit-principle-${id}`);
      const newPrinciple = principleEl ? principleEl.value.trim() : (topic.deep_lecture?.action_principle || '');
      const pointsEl = document.getElementById(`edit-points-${id}`);
      const newPoints = pointsEl ? pointsEl.value.split('\n').map(s => s.trim()).filter(Boolean) : (topic.deep_lecture?.core_points || []);

      if (!newTitle || !newSpeech) {
        alert('제목과 1분 30초 실전 답변은 필수입니다.');
        return;
      }

      topic.category = newCat;
      topic.category_label = (newCat === 'personality' ? '인성·협업·조직 가치' : '반도체 소자·공정 실전 핵심');
      topic.title = newTitle;
      topic.core_keyword = newKw;
      topic.speech_1m30s = newSpeech;
      topic.deep_lecture = topic.deep_lecture || {};
      topic.deep_lecture.background = newBg;
      topic.deep_lecture.action_principle = newPrinciple;
      topic.deep_lecture.core_points = newPoints;

      saveTopicsToStorage();
      renderDashboard();
      showToast('💾 문항 수정 내용이 성공적으로 저장되었습니다!');

      // 해당 카드로 부드럽게 스크롤
      const targetCard = document.getElementById(id);
      if (targetCard) {
        targetCard.scrollIntoView({ behavior: 'smooth' });
      }
    }

    // ========================================================
    // 4. 문항 삭제 기능 (Delete)
    // ========================================================
    function deleteTopic(id) {
      const topic = currentTopics.find(t => t.id === id);
      if (!topic) return;

      if (!confirm(`정말 "${topic.title}" 문항을 삭제하시겠습니까?\n(삭제 후에도 필요 시 기본값 복원 버튼으로 되돌릴 수 있습니다)`)) {
        return;
      }

      currentTopics = currentTopics.filter(t => t.id !== id);
      saveTopicsToStorage();
      renderDashboard();
      showToast('🗑️ 문항이 삭제되었습니다.');
    }

    // ========================================================
    // 5. 신규 문항 추가 모달 (Add Item Modal)
    // ========================================================
    function openAddModal() {
      document.getElementById('addModalBackdrop').classList.add('open');
      document.getElementById('newTitle').focus();
    }

    function closeAddModal() {
      document.getElementById('addModalBackdrop').classList.remove('open');
      document.getElementById('addForm').reset();
      updateSpeechCounter('newSpeech', 'newSpeechCounter');
    }

    function submitNewTopic(e) {
      e.preventDefault();

      const cat = document.getElementById('newCategory').value;
      const title = document.getElementById('newTitle').value.trim();
      const kw = document.getElementById('newKeywords').value.split(',').map(s => s.trim()).filter(Boolean);
      const speech = document.getElementById('newSpeech').value.trim();
      const bgEl = document.getElementById('newBg');
      const bg = bgEl ? bgEl.value.trim() : '';
      const principleEl = document.getElementById('newPrinciple');
      const principle = principleEl ? principleEl.value.trim() : '';
      const pointsEl = document.getElementById('newPoints');
      const points = pointsEl ? pointsEl.value.split('\n').map(s => s.trim()).filter(Boolean) : [];

      if (!title || !speech) {
        alert('제목과 1분 30초 실전 답변을 입력해주십시오.');
        return;
      }

      const newId = (cat === 'personality' ? 'p_custom_' : 't_custom_') + Date.now();
      const catCount = currentTopics.filter(t => t.category === cat).length + 1;

      const newTopic = {
        id: newId,
        category: cat,
        category_label: (cat === 'personality' ? '인성·협업·조직 가치' : '반도체 소자·공정 실전 핵심'),
        number: catCount,
        title: title,
        core_keyword: kw.length ? kw : ['핵심역량', '원인규명', '성과창출'],
        speech_1m30s: speech,
        deep_lecture: {
          background: bg || '출제 배경 및 맥락 정의',
          action_principle: principle || '1. 원인 파악 및 실행\n2. 정량적 검증',
          core_points: points.length ? points : ['핵심 전달력 유지', '데이터 연계']
        },
        svg_diagram: getDefaultSvg(kw, title)
      };

      currentTopics.push(newTopic);
      saveTopicsToStorage();
      closeAddModal();
      renderDashboard();
      showToast('🎉 신규 문항이 성공적으로 등록되었습니다!');

      // 신규 등록 카드로 스크롤 이동
      setTimeout(() => {
        const newEl = document.getElementById(newId);
        if (newEl) {
          newEl.scrollIntoView({ behavior: 'smooth' });
        }
      }, 150);
    }

    // ========================================================
    // 6. 데이터 백업 / 복원 기능
    // ========================================================
    function exportDataJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentTopics, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `aisk_topics_backup_${new Date().toISOString().slice(0, 10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('📥 현재 편집된 40+ 문항 데이터가 JSON 파일로 다운로드되었습니다.');
    }

    function resetToDefault() {
      if (confirm('모든 문항 데이터를 초기화하시겠습니까?\n(사용자가 수정한 내용 및 새로 추가한 문항이 모두 초기화됩니다)')) {
        localStorage.removeItem(STORAGE_KEY);
        currentTopics = JSON.parse(JSON.stringify(DEFAULT_TOPICS));
        renderDashboard();
        showToast('🔄 모든 문항 데이터가 초기화되었습니다.');
      }
    }

    // ========================================================
    // 7. 실시간 글자수 계산기
    // ========================================================
    function updateSpeechCounter(textareaId, counterId) {
      const el = document.getElementById(textareaId);
      const counter = document.getElementById(counterId);
      if (!el || !counter) return;

      const len = el.value.length;
      counter.textContent = `${len}자 (권장 380~450자)`;
      if (len >= 380 && len <= 450) {
        counter.classList.remove('warn');
      } else {
        counter.classList.add('warn');
      }
    }

    // ========================================================
    // 8. 필터 및 검색
    // ========================================================
    const filterChips = document.querySelectorAll('.filter-chip');
    filterChips.forEach(chip => {
      chip.addEventListener('click', () => {
        filterChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        applyFilterAndSearch();
      });
    });

    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', () => {
      applyFilterAndSearch();
    });

    function applyFilterAndSearch() {
      const activeFilterChip = document.querySelector('.filter-chip.active');
      const filter = activeFilterChip ? activeFilterChip.getAttribute('data-filter') : 'all';
      const query = searchInput.value.toLowerCase().trim();

      const navItems = document.querySelectorAll('.nav-item');
      const topicSections = document.querySelectorAll('.topic-section');

      navItems.forEach(item => {
        const itemCat = item.getAttribute('data-category');
        const searchData = item.getAttribute('data-search').toLowerCase();

        const catMatch = (filter === 'all' || itemCat === filter);
        const searchMatch = (query === '' || searchData.includes(query));

        item.style.display = (catMatch && searchMatch) ? 'block' : 'none';
      });

      topicSections.forEach(section => {
        const secCat = section.getAttribute('data-category');
        const secText = section.innerText.toLowerCase();

        const catMatch = (filter === 'all' || secCat === filter);
        const searchMatch = (query === '' || secText.includes(query));

        section.style.display = (catMatch && searchMatch) ? 'block' : 'none';
      });
    }

    // ========================================================
    // 9. 1분 30초 실전 타이머
    // ========================================================
    const TOTAL_SECONDS = 90;
    let remainingSeconds = TOTAL_SECONDS;
    let timerInterval = null;
    const timerDisplay = document.getElementById('timerDisplay');
    const timerProgress = document.getElementById('timerProgress');
    const timerStartBtn = document.getElementById('timerStartBtn');
    const timerPauseBtn = document.getElementById('timerPauseBtn');
    const timerResetBtn = document.getElementById('timerResetBtn');

    function updateTimerUI() {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      const pct = (remainingSeconds / TOTAL_SECONDS) * 100;
      timerProgress.style.width = pct + '%';

      if (remainingSeconds <= 15 && remainingSeconds > 0) {
        timerDisplay.classList.add('warning');
        timerProgress.classList.add('warning');
      } else {
        timerDisplay.classList.remove('warning');
        timerProgress.classList.remove('warning');
      }
    }

    timerStartBtn.addEventListener('click', () => {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateTimerUI();
        } else {
          clearInterval(timerInterval);
          timerInterval = null;
          showToast('⏰ 1분 30초 실전 발화 시간이 완료되었습니다!');
        }
      }, 1000);
    });

    timerPauseBtn.addEventListener('click', () => {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    });

    timerResetBtn.addEventListener('click', () => {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      remainingSeconds = TOTAL_SECONDS;
      updateTimerUI();
    });

    // ========================================================
    // 10. 복사 기능 & 토스트
    // ========================================================
    function copySpeech(id) {
      const el = document.getElementById(`speech-text-${id}`);
      if (!el) return;
      const text = el.innerText.trim();
      navigator.clipboard.writeText(text).then(() => {
        showToast('📋 1분 30초 실전 답변이 클립보드에 복사되었습니다!');
      }).catch(err => {
        console.error('복사 실패:', err);
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2600);
    }

    // ========================================================
    // 11. 사이드바 접기/열기 & 스크롤 감지
    // ========================================================
    const sidebarCollapseBtn = document.getElementById('sidebarCollapseBtn');
    const sidebarFloatOpenBtn = document.getElementById('sidebarFloatOpenBtn');

    if (sidebarCollapseBtn) {
      sidebarCollapseBtn.addEventListener('click', () => {
        document.body.classList.add('sidebar-collapsed');
        localStorage.setItem('aisk_sidebar_collapsed', 'true');
      });
    }

    if (sidebarFloatOpenBtn) {
      sidebarFloatOpenBtn.addEventListener('click', () => {
        document.body.classList.remove('sidebar-collapsed');
        localStorage.setItem('aisk_sidebar_collapsed', 'false');
      });
    }

    if (localStorage.getItem('aisk_sidebar_collapsed') === 'true') {
      document.body.classList.add('sidebar-collapsed');
    }

    let observer = null;
    function setupObserver() {
      if (observer) observer.disconnect();
      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const id = entry.target.id;
            document.querySelectorAll('.nav-link').forEach(link => {
              link.classList.remove('active');
            });
            const activeLink = document.getElementById(`link-${id}`);
            if (activeLink) {
              activeLink.classList.add('active');
            }
          }
        });
      }, {
        rootMargin: '-20% 0px -70% 0px'
      });

      document.querySelectorAll('.topic-section').forEach(sec => {
        observer.observe(sec);
      });
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ]
        });
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 실행 시작
    document.addEventListener('DOMContentLoaded', () => {
      loadTopics();
      renderDashboard();
    });
  </script>
</body>
</html>
